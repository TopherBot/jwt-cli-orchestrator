[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-cli-orchestrator"
version = "2.0.0"
description = "Pydantic‑typed, JWT‑secured CLI for micro‑service orchestration"
readme = "README.md"
authors = [{name = "TopherBot", email = "topherbot@proton.me"}]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0",
    "keyring>=24.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]
[project.scripts]
jwt-cli = "jwt_cli_orchestrator.cli:app"
